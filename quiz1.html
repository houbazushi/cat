<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>かんたんクイズ</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin-top: 60px;
  }

  button {
    display: block;
    width: 200px;
    margin: 10px auto;
    padding: 10px;
    font-size: 16px;
  }

  #result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>かんたんクイズ</h1>

<p id="question">日本の首都は？</p>

<button onclick="check('大阪')">大阪</button>
<button onclick="check('東京')">東京</button>
<button onclick="check('名古屋')">名古屋</button>

<p id="result"></p>

<script>
  function check(answer) {
    if (answer === '東京') {
      document.getElementById('result').textContent = '正解！';
    } else {
      document.getElementById('result').textContent = '不正解！';
    }
  }
</script>

<a href="index.html" target="_blank">元のページへ</a>

</body>
</html>
