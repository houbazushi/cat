  <script>
    function today() {
      const now = new Date();
      const month = now.getMonth() + 1; // 月（0から始まるので+1）
      const day = now.getDate();         // 日

      document.getElementById("result").textContent =
        "今日は" + month + "月" + day + "日です";
    }
  </script>
